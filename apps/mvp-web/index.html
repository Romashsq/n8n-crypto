<style>
:root {
  color-scheme: dark;
  --bg-app: #0F0F12;
  --bg-sidebar: #131317;
  --bg-surface: #18181D;
  --bg-raised: #1F1F25;
  --bg-active: #26262E;
  --border: #2A2A32;
  --border-strong: #3A3A44;
  --text-primary: #EDEDF0;
  --text-secondary: #A5A5B0;
  --text-muted: #80808C;
  --text-on-accent: #FFFFFF;
  --ruby-500: #B8243F;
  --ruby-600: #9F1D35;
  --ruby-700: #861830;
  --ruby-text: #E8687F;
  --ruby-tint: rgba(159, 29, 53, 0.14);
  --ruby-tint-surface: #2B1920; /* ruby tint flattened onto --bg-surface */
  --ruby-border: rgba(184, 36, 63, 0.45);
  --focus-ring: #C7375A;
  --up: #3DBE8B;
  --down: #EF5A52;
  --flat: #8B8B96;
  --warning: #D9A441;
  --info: #6F9DF2;
  --cat-gold: #C9B458;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.40);
  --sidebar-w: 272px;
  --ease: cubic-bezier(.2, .7, .3, 1);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg-app);
  color: var(--text-primary);
  font: 400 14px/20px var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: not-allowed; }
a { color: var(--ruby-text); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ic { flex-shrink: 0; display: block; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
kbd { font-family: var(--font-mono); font-size: 11px; line-height: 16px; color: var(--text-muted); }

/* ---------- App shell ---------- */
.app { display: flex; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }

/* ---------- Sidebar ---------- */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--bg-sidebar); border-right: 1px solid var(--border);
  padding-left: env(safe-area-inset-left, 0px);
  transition: margin-left 180ms var(--ease), transform 180ms var(--ease), visibility 0s linear 0s;
  z-index: 40; min-height: 0;
}
body.sb-collapsed .sidebar { margin-left: calc(-1 * var(--sidebar-w) - env(safe-area-inset-left, 0px)); visibility: hidden; transition: margin-left 180ms var(--ease), visibility 0s linear 180ms; }
.sb-head { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text-primary); border-radius: 6px; padding: 2px; margin-right: auto; }
.brand:hover { text-decoration: none; }
.wordmark { font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
.sb-actions { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 4px; flex-shrink: 0; }
.sb-row {
  display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 6px;
  color: var(--text-secondary); font-size: 13px; line-height: 18px; font-weight: 500; width: 100%;
  transition: background-color 140ms var(--ease), color 140ms var(--ease);
}
.sb-row span { flex: 1; min-width: 0; }
.sb-row:hover { background: var(--bg-raised); color: var(--text-primary); }
.sb-row.active { background: var(--bg-active); color: var(--text-primary); }
.sb-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 8px 16px; }
.sb-label { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 14px 8px 6px; }
.grp { margin-bottom: 4px; }
.grp-head { display: flex; align-items: center; gap: 4px; height: 32px; border-radius: 6px; padding-right: 4px; }
.grp-toggle {
  flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-radius: 6px;
  color: var(--text-primary); font-size: 13px; font-weight: 600; line-height: 18px;
  transition: background-color 140ms var(--ease);
}
.grp-toggle:hover { background: var(--bg-raised); }
.grp-toggle .chev { color: var(--text-muted); transition: transform 160ms var(--ease); }
.grp.collapsed .grp-toggle .chev { transform: rotate(-90deg); }
.grp-toggle .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grp-add {
  width: 24px; height: 24px; flex-shrink: 0; display: grid; place-items: center; border-radius: 6px;
  border: 1px solid var(--border); color: var(--text-muted); background: var(--bg-sidebar);
  transition: background-color 140ms var(--ease), color 140ms var(--ease), border-color 140ms var(--ease);
}
.grp-add:hover { background: var(--bg-raised); color: var(--text-primary); border-color: var(--border-strong); }
.chat-list { list-style: none; margin: 2px 0 6px; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.chat-row { position: relative; display: flex; align-items: center; border-radius: 6px; border: 1px solid transparent; }
.chat-row:hover { background: var(--bg-raised); }
.chat-row.active { background: var(--bg-active); }
.chat-link {
  flex: 1; min-width: 0; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 30px 0 24px; border-radius: 6px;
  color: var(--text-secondary); font-size: 13px; line-height: 18px;
}
.chat-link .ctx-ic { color: var(--text-muted); }
.chat-link .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-row:hover .chat-link, .chat-row.active .chat-link { color: var(--text-primary); }
.chat-row.active .chat-link { font-weight: 500; }
.chat-row.pinned { background: var(--ruby-tint); border-color: var(--ruby-border); margin: 2px 0 3px; }
.chat-row.pinned:hover { background: rgba(159, 29, 53, 0.20); }
.chat-row.pinned.active { background: rgba(159, 29, 53, 0.26); }
.chat-row.pinned .chat-link { padding-left: 8px; padding-right: 8px; color: var(--text-primary); font-weight: 500; }
.chat-row.pinned .pin-ic, .chat-row.pinned .end-ic { color: var(--ruby-text); }
.chat-more {
  position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; border-radius: 6px;
  display: grid; place-items: center; color: var(--text-muted); opacity: 0;
  transition: opacity 120ms var(--ease), background-color 120ms var(--ease);
}
.chat-row:hover .chat-more, .chat-row:focus-within .chat-more, .chat-more[aria-expanded="true"] { opacity: 1; }
.chat-more:hover, .chat-more[aria-expanded="true"] { background: var(--bg-active); color: var(--text-primary); }
.row-dot { position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--ruby-text); pointer-events: none; }
.row-dot.busy { background: var(--text-muted); animation: pulse 1.2s ease-in-out infinite; }
.chat-row:hover .row-dot, .chat-row:focus-within .row-dot { display: none; }
.rename-input {
  flex: 1; min-width: 0; height: 28px; margin: 1px 2px 1px 20px; padding: 0 8px; border-radius: 6px;
  background: var(--bg-app); border: 1px solid var(--ruby-border); color: var(--text-primary); font-size: 13px;
}
.show-all { margin: 0 0 4px 24px; height: 26px; padding: 0 6px; border-radius: 6px; font-size: 12px; color: var(--text-muted); }
.show-all:hover { color: var(--text-primary); background: var(--bg-raised); }
.profile { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border-top: 1px solid var(--border); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.avatar { width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center; background: var(--bg-active); border: 1px solid var(--border-strong); font-size: 11px; font-weight: 600; letter-spacing: 0.02em; color: var(--text-primary); }
.profile-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
.profile-name .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; height: 18px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 500; line-height: 16px; }
.pill.ruby { background: var(--ruby-tint); color: var(--ruby-text); }
.pill.muted { background: var(--bg-raised); color: var(--text-muted); border: 1px solid var(--border); }
.icon-btn {
  width: 32px; height: 32px; flex-shrink: 0; display: inline-grid; place-items: center; border-radius: 6px; color: var(--text-secondary);
  transition: background-color 140ms var(--ease), color 140ms var(--ease);
}
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--bg-raised); color: var(--text-primary); }
.scrim { display: none; }

/* ---------- Main ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--bg-app); }
.chat-header {
  height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--border);
}
.hdr-open { display: none; }
body.sb-collapsed .hdr-open { display: inline-grid; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; white-space: nowrap; }
.crumb-ws { color: var(--text-secondary); flex-shrink: 0; }
.crumb-sep { color: var(--text-muted); flex-shrink: 0; }
.crumb-cur { color: var(--text-primary); font-weight: 500; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumb-input { flex: 1; min-width: 80px; max-width: 360px; height: 30px; padding: 0 8px; border-radius: 6px; background: var(--bg-surface); border: 1px solid var(--ruby-border); font-size: 13px; }
.hdr-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.agent-badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 7px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-secondary); font-size: 12px; font-weight: 500; }
.agent-badge .ic { color: var(--ruby-text); }
.sym-chip { display: inline-flex; align-items: center; height: 26px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--border); font: 500 12px/16px var(--font-mono); color: var(--text-primary); letter-spacing: 0.02em; }
.hdr-new { display: none; }

.view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
.col { max-width: 768px; margin: 0 auto; padding: 24px 24px 32px; }

/* ---------- Empty state & agent tiles ---------- */
.empty { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; gap: 16px; }
.agent-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
.agent-tile {
  --a-line: #7A7A86; --a-fill: #3A3A44; --a-surface: #222229; --a-accent: #8B8B96; --a-hi: #B4B4BE; --a-gold: #8B8B96; --a-cut: var(--bg-surface);
  width: 124px; padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  border-radius: 12px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-secondary);
  transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
}
.agent-tile:hover { background: var(--bg-raised); border-color: var(--border-strong); color: var(--text-primary); --a-cut: var(--bg-raised); }
.agent-tile .lbl { font-size: 12px; line-height: 16px; font-weight: 500; }
.agent-tile .soon { font-size: 11px; line-height: 14px; color: var(--text-muted); }
.agent-tile.active, .art-on {
  --a-line: #E8687F; --a-fill: #9F1D35; --a-surface: #3A1A24; --a-accent: #E8687F; --a-hi: #FFFFFF; --a-gold: #C9B458; --a-cut: var(--ruby-tint-surface);
}
.agent-tile.active { background: var(--ruby-tint-surface); border-color: var(--ruby-border); color: var(--text-primary); }
.agent-tile svg.art { width: 56px; height: 56px; }
.empty-title { margin: 4px 0 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
.empty-desc { margin: 0; max-width: 52ch; color: var(--text-secondary); font-size: 14px; line-height: 20px; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 640px; margin-top: 8px; }
.chip {
  display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border-radius: 10px; text-align: left;
  background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-secondary); font-size: 13px; line-height: 18px;
  transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
}
.chip span { flex: 1; }
.chip .ic { color: var(--text-muted); }
.chip:hover:not(:disabled) { background: var(--bg-raised); border-color: var(--border-strong); color: var(--text-primary); }
.chip:disabled { opacity: 0.55; }

/* Topic (seeded chat) intro */
.topic { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 24px; gap: 12px; }
.topic-art { width: 88px; height: 88px; border-radius: 16px; display: grid; place-items: center; background: var(--ruby-tint-surface); border: 1px solid var(--ruby-border); --a-cut: var(--ruby-tint-surface); }
.topic-art svg { width: 60px; height: 60px; }
.topic-meta { font-size: 12px; line-height: 16px; color: var(--text-muted); margin-top: 4px; }
.topic-title { margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
.starter-card { width: 100%; max-width: 560px; text-align: left; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 4px; }
.starter-label { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
.starter-card p { margin: 0; color: var(--text-primary); font-size: 14px; line-height: 21px; }
.ctx-tag { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); font: 500 11px/16px var(--font-mono); color: var(--text-secondary); }
.topic-actions { display: flex; align-items: center; gap: 12px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
.hint { font-size: 12px; line-height: 16px; color: var(--text-muted); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 6px;
  font-size: 13px; line-height: 18px; font-weight: 500; border: 1px solid transparent; white-space: nowrap;
  transition: background-color 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
}
.btn.lg { height: 38px; padding: 0 16px; font-size: 14px; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.primary { background: var(--ruby-600); color: var(--text-on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--ruby-500); }
.btn.primary:active:not(:disabled) { background: var(--ruby-700); }
.btn.secondary { background: var(--bg-raised); border-color: var(--border); color: var(--text-primary); }
.btn.secondary:hover:not(:disabled) { background: var(--bg-active); border-color: var(--border-strong); }
.btn.ghost { color: var(--text-secondary); }
.btn.ghost:hover:not(:disabled) { background: var(--bg-raised); color: var(--text-primary); }
.btn:disabled { opacity: 0.5; }
.btn.primary:disabled { background: var(--bg-raised); color: var(--text-muted); opacity: 1; border-color: var(--border); }

/* ---------- Thread ---------- */
.thread { display: flex; flex-direction: column; gap: 22px; }
.msg-user { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.bubble { max-width: 80%; background: var(--bg-raised); border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 21px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-ctx { font: 500 11px/16px var(--font-mono); color: var(--text-muted); }
.msg-ai { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ai-head { display: flex; align-items: center; gap: 8px; }
.ai-avatar { width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; background: var(--bg-surface); border: 1px solid var(--border); color: var(--ruby-text); }
.ai-meta { font-size: 12px; line-height: 16px; color: var(--text-muted); }
.ai-meta b { color: var(--text-secondary); font-weight: 500; }
.ai-actions { display: flex; gap: 2px; margin-top: -2px; }
.ai-actions .icon-btn { width: 28px; height: 28px; color: var(--text-muted); }
.ai-actions .icon-btn:hover { color: var(--text-primary); }

.md { font-size: 15px; line-height: 24px; color: var(--text-primary); overflow-wrap: anywhere; min-width: 0; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 12px; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size: 16px; line-height: 22px; font-weight: 600; margin: 20px 0 8px; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
.md li { margin: 4px 0; }
.md li::marker { color: var(--text-muted); }
.md strong { font-weight: 600; color: var(--text-primary); }
.md em { color: var(--text-primary); }
.md code { font-family: var(--font-mono); font-size: 13px; background: var(--bg-raised); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px; }
.md pre code { background: none; border: 0; padding: 0; font-size: 13px; line-height: 20px; }
.md blockquote { margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 2px solid var(--border-strong); color: var(--text-secondary); }
.md a { color: var(--ruby-text); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
.md img { max-width: 100%; height: auto; border-radius: 6px; }
.table-wrap { width: 100%; overflow-x: auto; margin: 4px 0 14px; border: 1px solid var(--border); border-radius: 10px; }
.md table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 18px; }
.md th { background: var(--bg-surface); color: var(--text-secondary); font-weight: 500; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.md td { padding: 8px 12px; border-top: 1px solid var(--border); vertical-align: top; }
.md tbody tr:first-child td { border-top: 0; }
.md th.num, .md td.num { text-align: right; }

.setup-note { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; margin-bottom: 8px; border-radius: 10px; background: var(--bg-surface); border: 1px solid var(--border); font-size: 13px; line-height: 18px; color: var(--text-secondary); }

.composer { display: flex; flex-direction: column; background: var(--bg-surface); border: 1px solid var(--ruby-border); border-radius: 12px; transition: border-color 140ms var(--ease); }

}

.send {

.page { max-width: 640px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 16px; }

.radio-card .rd { font-size: 12px; line-height: 16px; color: var(--text-secondary); }
.radio-card:has(input:checked) { border-color: var(--ruby-border); background: var(--ruby-tint); }

.soon-wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 32px 24px; }

  /* ================= Markdown ================= */
  function inlineMd(s) { // s is already HTML-escaped
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_]+)__/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2">$1</a>');
  }
  // Fallback renderer used only if marked/DOMPurify failed to load. Escapes everything first, so it is safe by construction.
  function miniMarkdown(src) {
    const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
    const out = [];
    let para = [];
    let i = 0;
    const flush = () => { if (para.length) { out.push('<p>' + para.map((l) => inlineMd(esc(l))).join('<br>') + '</p>'); para = []; } };
    const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
    const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
    const cells = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
    while (i < lines.length) {
      const l = lines[i];
      let m;
      if (/^\s*```/.test(l)) {
        flush(); const buf = []; i += 1;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i += 1; }
        i += 1; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
      }
      if (isRow(l) && i + 1 < lines.length && isSep(lines[i + 1])) {
        flush(); const head = cells(l); i += 2; const rows = [];
        while (i < lines.length && isRow(lines[i])) { rows.push(cells(lines[i])); i += 1; }
        out.push('<table><thead><tr>' + head.map((c) => '<th>' + inlineMd(esc(c)) + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + r.map((c) => '<td>' + inlineMd(esc(c)) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
        continue;
      }
      if ((m = /^\s*#{1,6}\s+(.*)$/.exec(l))) { flush(); out.push('<h3>' + inlineMd(esc(m[1])) + '</h3>'); i += 1; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { flush(); out.push('<hr>'); i += 1; continue; }
      if (/^\s*[-*+]\s+/.test(l)) {
        flush(); const items = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*+]\s+/, '')); i += 1; }
        out.push('<ul>' + items.map((t) => '<li>' + inlineMd(esc(t)) + '</li>').join('') + '</ul>'); continue;
      }
      if (/^\s*\d+[.)]\s+/.test(l)) {
        flush(); const items = [];
        while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+[.)]\s+/, '')); i += 1; }
        out.push('<ol>' + items.map((t) => '<li>' + inlineMd(esc(t)) + '</li>').join('') + '</ol>'); continue;
      }
      if (/^\s*>\s?/.test(l)) {
        flush(); const q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i += 1; }
        out.push('<blockquote><p>' + q.map((t) => inlineMd(esc(t))).join('<br>') + '</p></blockquote>'); continue;
      }
      if (!l.trim()) { flush(); i += 1; continue; }
      para.push(l); i += 1;
    }
    flush();
    return out.join('');
  }

  let purifyHooked = false;
  function markdownToSafeHtml(md) {
    const hasLibs = window.marked && typeof window.marked.parse === 'function' && window.DOMPurify && typeof window.DOMPurify.sanitize === 'function';
    if (hasLibs) {
      if (!purifyHooked) {
        purifyHooked = true;
        try {
          window.DOMPurify.addHook('afterSanitizeAttributes', (node) => {
            if (node.tagName === 'A' && node.getAttribute('href')) { node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener noreferrer'); }
          });
        } catch (e) { /* ignore */ }
      }
      try {
        const raw = window.marked.parse(String(md), { gfm: true, breaks: false, async: false });
        return window.DOMPurify.sanitize(String(raw), { USE_PROFILES: { html: true }, FORBID_TAGS: ['style', 'form', 'input', 'button', 'textarea', 'select'] });
      } catch (e) { /* fall through to the escaped renderer */ }
    }
    const html = miniMarkdown(md);
    return window.DOMPurify && typeof window.DOMPurify.sanitize === 'function' ? window.DOMPurify.sanitize(html) : html;
  }

  const NUM_RE = /^[+\-−±~≈]?\s?[$€£]?\s?\d[\d,]*(\.\d+)?\s?(%|[kKmMbBtT]|x|bps?|pp)?(\s?(USD|USDT|EUR|BTC|ETH))?$/;
  function decorateMd(host) {
    $$('table', host).forEach((t) => {
      if (!t.parentElement.classList.contains('table-wrap')) {
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        t.parentNode.insertBefore(wrap, t);
        wrap.appendChild(t);
      }
      const rows = Array.from(t.rows);
      if (!rows.length) return;
      const cols = Math.max.apply(null, rows.map((r) => r.cells.length));
      for (let c = 0; c < cols; c += 1) {
        let n = 0; let num = 0;
        rows.forEach((r) => {
          const cell = r.cells[c];
          if (!cell || cell.tagName === 'TH') return;
          const tx = cell.textContent.trim().replace(/\s+/g, ' ');
          if (!tx || /^(—|-|–|n\/a|na)$/i.test(tx)) return;
          n += 1;
          if (NUM_RE.test(tx)) num += 1;
        });
        if (n && num / n >= 0.6) {
          rows.forEach((r) => {
            const cell = r.cells[c];
            if (!cell) return;
            cell.classList.add('num');
            if (cell.tagName === 'TD') {
              const tx = cell.textContent.trim();
              if (/^\+\s?[$€£]?\d/.test(tx)) cell.classList.add('up');
              else if (/^[-−]\s?[$€£]?\d/.test(tx)) cell.classList.add('down');
            }
          });
        }
      }
    });
  }

  function renderArtifacts() {

  /* ================= Composer ================= */
  function getCtx() { const c = currentChat(); return c ? c.ctx : state.draft; }
  function setCtx(patch) {

  function autosize() {

  function updateComposer() {

    const ready = agentReady(ws);

    const ctx = getCtx();
    el.input.placeholder = c && c.pinned ? 'Ask about your portfolio, or add holdings…' : 'Ask the ' + w.agent + '…';

    el.symbolList.innerHTML = (a ? a.list : ASSET_ORDER.reduce((acc, k) => acc.concat(ASSETS[k].list.slice(0, 2)), [])).map((s) => '<option value="' + esc(s) + '"></option>').join('');
    const hasText = el.input.value.trim().length > 0;
    el.sendBtn.disabled = !ready || busy || !hasText;

    el.sendBtn.innerHTML = busy ? '<span class="spinner" aria-hidden="true"></span>' : icon('zapFill', 18);
    el.sendBtn.setAttribute('aria-label', busy ? 'Waiting for the answer' : 'Send message');
    if (!ready) {
      const alt = firstReadyWs();
      const showAlt = agentReady(alt) && alt !== ws;
      el.setupNote.innerHTML = icon('hourglass', 16) + '<span class="txt">The ' + esc(w.agent) + ' is being set up. You can read and type here, and sending will open as soon as it is live.</span>' +
        (showAlt ? '<button type="button" class="btn secondary sm" data-act="use-ws" data-ws="' + alt + '">Ask the ' + esc(WS[alt].agent) + '</button>' : '');

    } else {
      el.setupNote.hidden = true;
      el.setupNote.innerHTML = '';

  }
  function stashDraft() { drafts.set(draftKey(), el.input.value); }
  function restoreDraft() { el.input.value = drafts.get(draftKey()) || ''; autosize(); }
  function focusComposer() { if (!isMobile()) { try { el.input.focus({ preventScroll: true }); } catch (e) { el.input.focus(); } } }

  function contextLine(ctx) {
    const parts = [];
    if (ctx && ctx.asset && ASSETS[ctx.asset]) parts.push('asset class = ' + ASSETS[ctx.asset].label);
    if (ctx && ctx.symbol) parts.push('symbol = ' + ctx.symbol);
    if (state.profile.risk && RISK[state.profile.risk]) parts.push('risk profile = ' + RISK[state.profile.risk].label);
    return parts.length ? '[Context: ' + parts.join(', ') + ']' : '';
  }

  /* ================= Navigation ================= */
  function closeDrawer() {
    if (document.body.classList.contains('drawer-open')) {

  function openChat(id) {

  function openHome(ws, carryText) {
    stashDraft();

    state.selected = null;
    if (ws && WS[ws]) state.draft.ws = ws;
    save();
    closeDrawer();
    render();
    if (typeof carryText === 'string') { el.input.value = carryText; autosize(); } else restoreDraft();
    updateComposer();

  }
  function openPage(name, anchor) {
    stashDraft();
    view = name;
    closeDrawer();
    render();
    el.view.scrollTop = 0;
    if (anchor) { const t = document.getElementById(anchor); if (t) { t.scrollIntoView({ block: 'start' }); const f = $('input', t); if (f) f.focus({ preventScroll: true }); } }
  }
  function createChat(ws) {
    // Reuse an untouched "New chat" in this group instead of stacking empty rows.
    const blank = state.chats.find((x) => x.ws === ws && x.fresh && !msgsOf(x.id).length && !pending.has(x.id));
    if (blank) { blank.updatedAt = Date.now(); state.collapsed[ws] = false; openChat(blank.id); return blank; }
    const now = Date.now();
    const c = { id: uid('c'), ws, title: 'New chat', starter: null, icon: null, ctx: { asset: null, symbol: '' }, sessionId: newSession(ws), pinned: false, createdAt: now, updatedAt: now, fresh: true, unread: false };
    state.chats.push(c);
    state.collapsed[ws] = false;
    save();
    openChat(c.id);
    return c;
  }
  function pickAgent(ws) {
    if (!WS[ws]) return;
    const c = currentChat();
    const text = el.input.value;
    if (!c) { state.draft.ws = ws; save(); render(); updateComposer(); focusComposer(); return; }
    if (c.fresh && !msgsOf(c.id).length && !pending.has(c.id)) {
      c.ws = ws; c.sessionId = newSession(ws); state.collapsed[ws] = false; save(); render(); focusComposer(); return;
    }
    if (c.ws === ws) return;
    openHome(ws, text);
  }

  function scrollToBottom() {
    requestAnimationFrame(() => { el.view.scrollTop = el.view.scrollHeight; });
  }
  function nearBottom() { return el.view.scrollHeight - el.view.scrollTop - el.view.clientHeight < 160; }

  /* ================= Sending ================= */
  function pushMsg(chatId, m) {
    if (!state.messages[chatId]) state.messages[chatId] = [];
    const msg = Object.assign({ id: uid('m'), ts: Date.now() }, m);
    state.messages[chatId].push(msg);
    return msg;
  }

  function submitComposer() {
    const text = el.input.value.trim();
    if (!text) return;
    const ws = activeWs();
    if (!agentReady(ws)) { updateComposer(); return; }
    let c = currentChat();
    if (c && pending.has(c.id)) return;
    if (!c) {
      const now = Date.now();
      c = { id: uid('c'), ws, title: makeTitle(text), starter: null, icon: null, ctx: { asset: state.draft.asset, symbol: state.draft.symbol }, sessionId: newSession(ws), pinned: false, createdAt: now, updatedAt: now, fresh: false, unread: false };
      state.chats.push(c);
      state.collapsed[ws] = false;
      drafts.delete('home');
      state.selected = c.id;
      view = 'chat';
    }
    el.input.value = '';
    drafts.delete(c.id);
    autosize();
    sendInChat(c, text, c.ctx);
  }

  function sendInChat(c, text, ctx) {
    if (!agentReady(c.ws) || pending.has(c.id)) return;
    if (c.fresh) { c.title = makeTitle(text); c.fresh = false; }
    const line = contextLine(ctx);
    const chatInput = line ? line + '\n' + text : text;
    pushMsg(c.id, { role: 'user', text, ctx: ctxText(ctx) });
    c.updatedAt = Date.now();
    c.unread = false;
    save();
    dispatch(c.id, chatInput);
  }

  function extractReply(raw) {
    const pick = (d, depth) => {
      if (d == null || depth > 4) return '';
      if (typeof d === 'string') return d;
      if (Array.isArray(d)) return d.map((x) => pick(x, depth + 1)).filter(Boolean).join('\n\n');
      if (typeof d === 'object') {
        const keys = ['output', 'text', 'response', 'answer', 'reply', 'message', 'content'];
        for (let i = 0; i < keys.length; i += 1) { if (typeof d[keys[i]] === 'string') return d[keys[i]]; }
        for (let i = 0; i < keys.length; i += 1) { if (d[keys[i]] && typeof d[keys[i]] === 'object') { const r = pick(d[keys[i]], depth + 1); if (r) return r; } }
        if (d.json) return pick(d.json, depth + 1);
        if (d.data) return pick(d.data, depth + 1);
      }
      return '';
    };
    const t = String(raw == null ? '' : raw);
    try { return pick(JSON.parse(t), 0); } catch (e) { return t; }
  }

  async function callAgent(url, sessionId, chatInput, signal) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json, text/plain, */*' },
      body: JSON.stringify({ action: 'sendMessage', sessionId, chatInput }),
      signal,
      credentials: 'omit',
      cache: 'no-store'
    });
    const raw = await res.text();
    if (!res.ok) {
      const err = new Error('HTTP ' + res.status);
      err.kind = 'http';
      err.status = res.status;
      err.detail = extractReply(raw).replace(/\s+/g, ' ').trim().slice(0, 180);
      throw err;
    }
    const out = extractReply(raw);
    if (!out || !out.trim()) { const err = new Error('Empty reply'); err.kind = 'empty'; throw err; }
    return out;
  }

  function errorFor(kind, agent, status) {
    if (kind === 'timeout') return 'The ' + agent + " didn't answer within 3 minutes. Retry, or ask a narrower question.";
    if (kind === 'http') return 'The ' + agent + " couldn't finish this answer" + (status ? ' (HTTP ' + status + ')' : '') + '. Retry in a moment.';
    if (kind === 'empty') return 'The ' + agent + ' returned an empty answer. Retry, or rephrase the question.';
    if (kind === 'setup') return 'The ' + agent + ' is being set up. Retry once it is live.';
    return "Couldn't reach the " + agent + '. Check your connection and retry.';
  }

  async function dispatch(chatId, chatInput) {
    const c = chatById(chatId);
    if (!c) return;
    const agent = WS[c.ws].agent;
    const url = webhookFor(c.ws);
    if (!url) {
      pushMsg(chatId, { role: 'error', kind: 'setup', text: errorFor('setup', agent), retry: chatInput, ws: c.ws });
      save(); afterRun(chatId, false);
      return;
    }
    const ctrl = new AbortController();
    const run = { start: Date.now(), ctrl, timedOut: false };
    const timer = setTimeout(() => { run.timedOut = true; ctrl.abort(); }, TIMEOUT_MS);
    pending.set(chatId, run);
    c.inflight = chatInput; // persisted so a reload mid-answer can offer Retry (see normalize)
    saveNow();
    ensureTicker();
    renderSidebar();
    if (isViewing(chatId)) { renderMain(); scrollToBottom(); }
    let ok = false;
    try {
      const reply = await callAgent(url, sessionFor(c), chatInput, ctrl.signal);
      if (!chatById(chatId)) return;
      pushMsg(chatId, { role: 'assistant', text: reply, ws: c.ws });
      ok = true;
      announce(agent + ' replied.');
    } catch (err) {
      if (!chatById(chatId) || run.cancelled) return;
      let kind = 'network';
      if (run.timedOut) kind = 'timeout';
      else if (err && err.kind) kind = err.kind;
      pushMsg(chatId, { role: 'error', kind, text: errorFor(kind, agent, err && err.status), detail: kind === 'http' && err.detail ? err.detail : '', retry: chatInput, ws: c.ws });
      announce(errorFor(kind, agent, err && err.status));
    } finally {
      clearTimeout(timer);
      if (pending.get(chatId) === run) pending.delete(chatId);
      if (!pending.size) stopTicker();
      if (chatById(chatId) && !run.cancelled) { delete c.inflight; save(); afterRun(chatId, ok); }
      else if (!chatById(chatId)) { delete state.messages[chatId]; save(); }
    }
  }

  function afterRun(chatId, ok) {
    const c = chatById(chatId);
    if (!c) return;
    c.updatedAt = Date.now();
    if (isViewing(chatId)) {
      const wasNear = nearBottom();
      renderMain();
      renderSidebar();
      const items = $$('#thread > .msg-ai, #thread > .msg-user', el.view);
      const last = items[items.length - 1];
      if (last && wasNear) {
        requestAnimationFrame(() => {
          const top = last.offsetTop - 16;
          el.view.scrollTop = last.offsetHeight > el.view.clientHeight ? top : el.view.scrollHeight;
        });
      }
    } else {
      c.unread = true;
      renderSidebar();
      updateComposer();
      toast((ok ? WS[c.ws].agent + ' replied in “' : 'The answer failed in “') + c.title + '”', ok ? 'ok' : 'error');
    }
    save();
  }

  function retryMessage(mid) {
    const c = currentChat();
    if (!c || pending.has(c.id)) return;
    const list = msgsOf(c.id);
    const idx = list.findIndex((m) => m.id === mid);
    if (idx < 0) return;
    const m = list[idx];
    if (!m.retry) return;
    list.splice(idx, 1);
    save();
    dispatch(c.id, m.retry);
  }

  function ensureTicker() {
    if (tickTimer) return;
    tickTimer = setInterval(() => {
      $$('[data-thinking]', el.view).forEach((node) => {
        const id = node.getAttribute('data-thinking');
        const p = pending.get(id);
        const c = chatById(id);
        if (!p || !c) return;
        const e = Date.now() - p.start;
        const lbl = $('.lbl', node);
        const t = thinkingLabel(c.ws, e);
        if (lbl && lbl.textContent !== t) lbl.textContent = t;
        const tm = $('.elapsed', node);
        if (tm) tm.textContent = fmtElapsed(e);
      });
    }, 1000);
  }
  function stopTicker() { clearInterval(tickTimer); tickTimer = null; }

  /* ================= Floating menus ================= */
  let menuState = null;
  function closeMenu(restoreFocus) {
    if (!menuState) return;
    const { node, anchor } = menuState;
    menuState = null;
    node.remove();
    if (anchor && anchor.isConnected) {
      anchor.setAttribute('aria-expanded', 'false');
      if (restoreFocus) anchor.focus();
    }
  }
  function positionMenu() {
    if (!menuState) return;
    const { node, anchor, placement } = menuState;
    const r = anchor.getBoundingClientRect();
    const mw = node.offsetWidth; const mh = node.offsetHeight;
    const vw = window.innerWidth; const vh = window.innerHeight;
    let top = placement.indexOf('top') === 0 ? r.top - mh - 6 : r.bottom + 6;
    if (top + mh > vh - 8) top = r.top - mh - 6;
    if (top < 8) top = Math.min(r.bottom + 6, vh - mh - 8);
    let left = /end$/.test(placement) ? r.right - mw : r.left;
    left = Math.max(8, Math.min(left, vw - mw - 8));
    node.style.top = Math.round(Math.max(8, top)) + 'px';
    node.style.left = Math.round(left) + 'px';
  }
  function menuFocusables(node) { return $$('button:not(:disabled)', node); }
  function openMenu(anchor, items, opts) {
    const o = opts || {};
    closeMenu(false);
    const node = document.createElement('div');
    node.className = 'menu';
    node.setAttribute('role', 'menu');
    node.setAttribute('aria-label', o.label || 'Menu');
    document.body.appendChild(node);
    menuState = { node, anchor, placement: o.placement || 'bottom-end' };
    anchor.setAttribute('aria-expanded', 'true');
    setMenuItems(items);
    node.addEventListener('keydown', onMenuKey);
  }
  function setMenuItems(items) {
    if (!menuState) return;
    const { node } = menuState;
    node.innerHTML = '';
    items.forEach((it) => {
      if (it.sep) { const s = document.createElement('div'); s.className = 'menu-sep'; s.setAttribute('role', 'separator'); node.appendChild(s); return; }
      if (it.heading) { const h = document.createElement('div'); h.className = 'menu-label'; h.textContent = it.heading; node.appendChild(h); return; }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'menu-item' + (it.danger ? ' danger' : '');
      b.setAttribute('role', it.checked != null ? 'menuitemradio' : 'menuitem');
      if (it.checked != null) b.setAttribute('aria-checked', String(!!it.checked));
      b.innerHTML = icon(it.icon || 'message', 16) + '<span></span>' + (it.checked ? icon('check', 14, 'chk') : '');
      b.querySelector('span').textContent = it.label;
      b.addEventListener('click', (e) => { e.stopPropagation(); it.onSelect(); });
      node.appendChild(b);
    });
    positionMenu();
    const f = menuFocusables(node)[0];
    if (f) f.focus();
  }
  function setMenuConfirm(message, sub, confirmLabel, onConfirm) {
    if (!menuState) return;
    const { node } = menuState;
    node.innerHTML = '<div class="menu-confirm" role="group"><p></p>' + (sub ? '<p class="sub"></p>' : '') +
      '<div class="row"><button type="button" class="btn primary sm" data-c="yes"></button><button type="button" class="btn ghost sm" data-c="no">Cancel</button></div></div>';
    $('p', node).textContent = message;
    if (sub) $('p.sub', node).textContent = sub;
    $('[data-c="yes"]', node).textContent = confirmLabel;
    $('[data-c="yes"]', node).addEventListener('click', (e) => { e.stopPropagation(); onConfirm(); });
    $('[data-c="no"]', node).addEventListener('click', (e) => { e.stopPropagation(); closeMenu(true); });
    positionMenu();
    $('[data-c="no"]', node).focus();
  }
  function onMenuKey(e) {
    if (!menuState) return;
    const items = menuFocusables(menuState.node);
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      const n = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
      items[n].focus();
    } else if (e.key === 'Home') { e.preventDefault(); if (items[0]) items[0].focus(); }
    else if (e.key === 'End') { e.preventDefault(); if (items.length) items[items.length - 1].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if (e.key === 'Tab') { closeMenu(false); }
  }

  function chatMenu(anchor, c, where) {
    openMenu(anchor, [
      { label: 'Rename', icon: 'pencil', onSelect: () => { closeMenu(false); startRename(c.id, where); } },
      { label: 'Delete', icon: 'trash', danger: true, onSelect: () => setMenuConfirm('Delete “' + c.title + '”?', 'Its messages are removed from this device.', 'Delete', () => { closeMenu(false); deleteChat(c.id); }) }
    ], { label: 'Chat options', placement: 'bottom-end' });
  }

  function assetMenu() {
    const ctx = getCtx();
    const items = [{ heading: 'Asset class' }];
    ASSET_ORDER.forEach((k) => {
      items.push({ label: ASSETS[k].label, icon: ASSETS[k].icon, checked: ctx.asset === k, onSelect: () => { chooseAsset(k); } });
    });
    items.push({ sep: true });
    items.push({ label: 'No asset class', icon: 'x', checked: !ctx.asset, onSelect: () => { chooseAsset(null); } });
    openMenu(el.assetBtn, items, { label: 'Asset class', placement: 'top-start' });
  }
  function chooseAsset(k) {
    const ctx = getCtx();
    const changed = ctx.asset !== k;
    closeMenu(false);
    setCtx({ asset: k, symbol: changed ? '' : ctx.symbol });
    if (k) el.symbol.focus(); else el.assetBtn.focus();
  }

  function gearMenu() {
    openMenu(el.gearBtn, [
      { label: 'Profile', icon: 'user', onSelect: () => { closeMenu(false); openPage('settings', 'sec-profile'); } },
      { label: 'Risk profile', icon: 'gauge', onSelect: () => { closeMenu(false); openPage('settings', 'sec-risk'); } },
      { sep: true },
      { label: 'Clear local data', icon: 'eraser', danger: true, onSelect: () => setMenuConfirm('Clear all chats and messages on this device?', 'Your Portfolio chat link is kept, so saved holdings stay available.', 'Clear data', () => { closeMenu(false); clearLocalData(); }) }
    ], { label: 'Settings', placement: 'top-end' });
  }

  /* ================= Rename / delete ================= */
  function startRename(id, where) {
    const c = chatById(id);
    if (!c || c.pinned) return;
    const mode = where === 'header' && isViewing(id) && $('#crumbTitle') ? 'header' : 'sidebar';
    let host;
    if (mode === 'header') {
      host = $('#crumbTitle');
    } else {
      if (isMobile() && !document.body.classList.contains('drawer-open')) openDrawer(false);
      state.collapsed[c.ws] = false;
      renderSidebar();
      host = $('.chat-row[data-id="' + CSS.escape(id) + '"]', el.groups);
    }
    if (!host) return;
    const input = document.createElement('input');
    input.className = mode === 'header' ? 'crumb-input' : 'rename-input';
    input.value = c.title;
    input.maxLength = 80;
    input.setAttribute('aria-label', 'Chat title');
    if (mode === 'header') host.replaceWith(input);
    else { host.innerHTML = ''; host.appendChild(input); }
    renaming = mode;
    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      renaming = null;
      const v = input.value.replace(/\s+/g, ' ').trim();
      if (commit && v && v !== c.title) { c.title = v.slice(0, 80); c.fresh = false; save(); toast('Chat renamed'); }
      renderSidebar();
      renderHeader();
      const btn = $('.chat-row[data-id="' + CSS.escape(id) + '"] .chat-link', el.groups);
      if (mode === 'sidebar' && btn) btn.focus();
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
    });
    input.addEventListener('blur', () => finish(true));
    input.focus();
    input.select();
  }

  function deleteChat(id) {
    const c = chatById(id);
    if (!c || c.pinned) return;
    const p = pending.get(id);
    if (p) { p.cancelled = true; try { p.ctrl.abort(); } catch (e) { /* ignore */ } pending.delete(id); }
    (state.messages[id] || []).forEach((m) => mdCache.delete(m.id));
    delete state.messages[id];
    state.chats = state.chats.filter((x) => x.id !== id);
    drafts.delete(id);
    const wasOpen = isViewing(id);
    save();
    if (wasOpen) { state.selected = null; state.draft.ws = c.ws; render(); restoreDraft(); updateComposer(); }
    else renderSidebar();
    toast('Chat deleted');
  }

  function clearLocalData() {
    pending.forEach((p) => { p.cancelled = true; try { p.ctrl.abort(); } catch (e) { /* ignore */ } });
    pending.clear();
    stopTicker();
    mdCache.clear();
    drafts.clear();
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
    state = seedState();
    view = 'chat';
    el.input.value = '';
    autosize();
    saveNow();
    render();
    toast('Local data cleared');
  }

  /* ================= Search palette ================= */
  let paletteResults = [];
  let paletteIndex = 0;
  let paletteReturn = null;
  function openPalette() {
    closeMenu(false);
    paletteReturn = document.activeElement;
    el.palette.hidden = false;
    el.paletteInput.value = '';
    renderPalette();
    el.paletteInput.focus();
  }
  function closePalette() {
    if (el.palette.hidden) return;
    el.palette.hidden = true;
    if (paletteReturn && paletteReturn.isConnected) paletteReturn.focus();
  }
  function renderPalette() {
    const q = el.paletteInput.value.trim().toLowerCase();
    const all = state.chats.slice().sort((a, b) => (a.pinned !== b.pinned ? (a.pinned ? -1 : 1) : b.updatedAt - a.updatedAt));
    paletteResults = !q ? all.slice(0, 30) : all.filter((c) => {
      if (c.title.toLowerCase().includes(q) || WS[c.ws].label.toLowerCase().includes(q)) return true;
      return msgsOf(c.id).some((m) => String(m.text || '').toLowerCase().includes(q));
    }).slice(0, 30);
    paletteIndex = 0;
    if (!paletteResults.length) {
      el.paletteList.innerHTML = '<li class="palette-empty" role="presentation">No chats match “' + esc(el.paletteInput.value.trim()) + '”</li>';
      el.paletteInput.removeAttribute('aria-activedescendant');
      return;
    }
    el.paletteList.innerHTML = paletteResults.map((c, i) => '<li class="palette-item" role="option" id="pi-' + i + '" data-i="' + i + '" aria-selected="' + (i === 0) + '">' +
      icon(c.pinned ? 'pin' : WS[c.ws].icon, 14) + '<span class="t">' + esc(c.title) + '</span><span class="w">' + esc(WS[c.ws].label) + '</span></li>').join('');
    el.paletteInput.setAttribute('aria-activedescendant', 'pi-0');
  }
  function movePalette(d) {
    if (!paletteResults.length) return;
    paletteIndex = (paletteIndex + d + paletteResults.length) % paletteResults.length;
    $$('.palette-item', el.paletteList).forEach((n, i) => n.setAttribute('aria-selected', String(i === paletteIndex)));
    const cur = $('#pi-' + paletteIndex);
    if (cur) cur.scrollIntoView({ block: 'nearest' });
    el.paletteInput.setAttribute('aria-activedescendant', 'pi-' + paletteIndex);
  }
  function choosePalette(i) {
    const c = paletteResults[i];
    if (!c) return;
    el.palette.hidden = true;
    openChat(c.id);
  }

  /* ================= Toasts / announcements ================= */
  function toast(text, kind) {
    const t = document.createElement('div');
    t.className = 'toast' + (kind === 'error' ? ' error' : '');
    t.innerHTML = icon(kind === 'error' ? 'alert' : 'check', 16) + '<span></span>';
    t.querySelector('span').textContent = text;
    el.toasts.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }
  function announce(text) { el.srLive.textContent = ''; setTimeout(() => { el.srLive.textContent = text; }, 50); }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) { /* fall back */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) { return false; }
  }

  /* ================= Events ================= */
  // Sidebar
  $('#newChatBtn').addEventListener('click', () => openHome(defaultWs(), ''));
  $('#hdrNew').addEventListener('click', () => openHome(defaultWs(), ''));
  $('#searchBtn').addEventListener('click', () => { closeDrawer(); openPalette(); });
  el.artifactsBtn.addEventListener('click', () => openPage('artifacts'));
  $('#brandLink').addEventListener('click', (e) => { e.preventDefault(); openHome(defaultWs(), ''); });
  $('#sbClose').addEventListener('click', () => {
    if (isMobile()) { closeDrawer(); el.hdrOpen.focus(); return; }
    state.sbCollapsed = true; document.body.classList.add('sb-collapsed'); save();
    el.hdrOpen.setAttribute('aria-expanded', 'false');
    el.hdrOpen.focus();
  });
  el.hdrOpen.addEventListener('click', () => {
    if (isMobile()) { if (document.body.classList.contains('drawer-open')) closeDrawer(); else openDrawer(); return; }
    state.sbCollapsed = false; document.body.classList.remove('sb-collapsed'); save();
    el.hdrOpen.setAttribute('aria-expanded', 'true');
    const first = $('[data-nav]', el.sidebar); if (first) first.focus();
  });
  el.scrim.addEventListener('click', closeDrawer);
  el.gearBtn.addEventListener('click', (e) => { e.stopPropagation(); if (menuState && menuState.anchor === el.gearBtn) closeMenu(false); else gearMenu(); });

  el.groups.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.getAttribute('data-act');
    const ws = t.getAttribute('data-ws');
    const id = t.getAttribute('data-id');
    if (act === 'toggle-group') {
      state.collapsed[ws] = !state.collapsed[ws]; save(); renderSidebar();
      const b = $('.grp-toggle[data-ws="' + ws + '"]', el.groups); if (b) b.focus();
    } else if (act === 'add-chat') {
      createChat(ws);
    } else if (act === 'open-chat') {
      openChat(id);
    } else if (act === 'chat-menu') {
      e.stopPropagation();
      if (menuState && menuState.anchor === t) { closeMenu(false); return; }
      const c = chatById(id); if (c) chatMenu(t, c, 'sidebar');
    } else if (act === 'show-all') {
      state.showAll[ws] = !state.showAll[ws]; save(); renderSidebar();
    }
  });

  // Arrow-key navigation through the sidebar
  el.sidebar.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const t = e.target;
    if (!t.matches || !t.matches('[data-nav]')) return;
    const list = $$('[data-nav]', el.sidebar).filter((n) => n.offsetParent !== null);
    const i = list.indexOf(t);
    if (i < 0) return;
    e.preventDefault();
    const n = list[e.key === 'ArrowDown' ? Math.min(list.length - 1, i + 1) : Math.max(0, i - 1)];
    if (n) n.focus();
  });

  // Header
  el.hdrRight.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act="header-menu"]');
    if (!t) return;
    e.stopPropagation();
    if (menuState && menuState.anchor === t) { closeMenu(false); return; }
    const c = currentChat(); if (c && !c.pinned) chatMenu(t, c, 'header');
  });

  // Main view
  el.view.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    const act = t.getAttribute('data-act');
    const c = currentChat();
    if (act === 'pick-agent') pickAgent(t.getAttribute('data-ws'));
    // Actions below rebuild #view and remove the clicked button, so focus moves to the composer
    // instead of falling back to <body>.
    else if (act === 'chip') {
      const text = t.getAttribute('data-prompt');
      if (c) sendInChat(c, text, c.ctx);
      else { el.input.value = text; submitComposer(); }
      focusComposer();
    } else if (act === 'start' && c && c.starter) { sendInChat(c, c.starter, c.ctx); focusComposer(); }
    else if (act === 'retry') { retryMessage(t.getAttribute('data-mid')); focusComposer(); }
    else if (act === 'copy' && c) {
      const m = msgsOf(c.id).find((x) => x.id === t.getAttribute('data-mid'));
      if (m) toast((await copyText(m.text)) ? 'Answer copied' : "Couldn't copy. Select the text instead.", undefined);
    } else if (act === 'pf-show' && c) { sendInChat(c, PF_PROMPTS.show, { asset: null, symbol: '' }); focusComposer(); }
    else if (act === 'pf-review' && c) { sendInChat(c, PF_PROMPTS.review, { asset: null, symbol: '' }); focusComposer(); }
    else if (act === 'pf-add') {
      el.input.value = PF_PROMPTS.add;
      autosize(); updateComposer();
      el.input.focus();
      el.input.setSelectionRange(el.input.value.length, el.input.value.length);
    } else if (act === 'save-name') {
      const inp = $('#nameInput');
      const v = inp ? inp.value.replace(/\s+/g, ' ').trim().slice(0, 40) : '';
      if (!v) { toast('Enter a display name first', 'error'); return; }
      state.profile.name = v; save(); renderSidebar(); toast('Name saved');
    } else if (act === 'clear-risk') {
      state.profile.risk = null; save(); renderSettings(); toast('Risk profile cleared');
    } else if (act === 'go-home') openHome(defaultWs());
  });
  el.view.addEventListener('change', (e) => {
    if (e.target && e.target.name === 'risk' && RISK[e.target.value]) {
      state.profile.risk = e.target.value; save();
      toast('Risk profile set to ' + RISK[e.target.value].label);
      if (!$('[data-act="clear-risk"]', el.view)) { renderSettings(); const r = $('input[name="risk"][value="' + e.target.value + '"]', el.view); if (r) r.focus(); }
    }
  });
  el.view.addEventListener('keydown', (e) => {
    if (e.target && e.target.id === 'nameInput' && e.key === 'Enter') { e.preventDefault(); const b = $('[data-act="save-name"]', el.view); if (b) b.click(); }
  });

  // Composer
  el.composer.addEventListener('submit', (e) => { e.preventDefault(); submitComposer(); });
  el.input.addEventListener('input', () => { autosize(); updateComposer(); });
  el.input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      if (!el.sendBtn.disabled) submitComposer();
    }
  });
  el.assetBtn.addEventListener('click', (e) => { e.stopPropagation(); if (menuState && menuState.anchor === el.assetBtn) closeMenu(false); else assetMenu(); });
  el.assetBtn.addEventListener('keydown', (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); assetMenu(); } });
  el.symbol.addEventListener('input', () => {
    const pos = el.symbol.selectionStart;
    const v = cleanSymbol(el.symbol.value);
    if (v !== el.symbol.value) { el.symbol.value = v; try { el.symbol.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } }
    getCtx().symbol = v; save(); renderHeader();
  });
  el.symbol.addEventListener('change', () => { setCtx({ symbol: cleanSymbol(el.symbol.value) }); });
  el.symbol.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); el.input.focus(); } });
  el.setupNote.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act="use-ws"]');
    if (t) openHome(t.getAttribute('data-ws'), el.input.value);
  });

  // Palette
  el.paletteInput.addEventListener('input', renderPalette);
  el.paletteInput.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); movePalette(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); movePalette(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); choosePalette(paletteIndex); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePalette(); }
    else if (e.key === 'Tab') { e.preventDefault(); }
  });
  el.paletteList.addEventListener('click', (e) => { const li = e.target.closest('[data-i]'); if (li) choosePalette(Number(li.getAttribute('data-i'))); });
  el.palette.addEventListener('mousedown', (e) => { if (e.target === el.palette) closePalette(); });

  // Global
  document.addEventListener('pointerdown', (e) => {
    if (menuState && !menuState.node.contains(e.target) && !menuState.anchor.contains(e.target)) closeMenu(false);
  });
  document.addEventListener('scroll', (e) => { if (menuState && !menuState.node.contains(e.target)) closeMenu(false); }, true);
  window.addEventListener('resize', () => { if (menuState) closeMenu(false); if (!isMobile()) closeDrawer(); });
  document.addEventListener('keydown', (e) => {
    const mod = isMac ? e.metaKey : e.ctrlKey;
    if (mod && !e.shiftKey && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); if (el.palette.hidden) openPalette(); else closePalette(); return; }
    if (mod && e.shiftKey && (e.key === 'o' || e.key === 'O')) { e.preventDefault(); openHome(defaultWs(), ''); return; }
    if (e.key === 'Escape') {
      if (menuState) { closeMenu(true); return; }
      if (!el.palette.hidden) { closePalette(); return; }
      if (document.body.classList.contains('drawer-open')) { closeDrawer(); el.hdrOpen.focus(); }
    }
  });
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

  /* ================= Init ================= */
  function init() {
    hydrateIcons(document);
    $('#kbdNew').textContent = isMac ? '⌘⇧O' : 'Ctrl ⇧ O';
    $('#kbdSearch').textContent = isMac ? '⌘K' : 'Ctrl K';
    if (state.sbCollapsed && !isMobile()) document.body.classList.add('sb-collapsed');
    el.hdrOpen.setAttribute('aria-expanded', String(!state.sbCollapsed && !isMobile()));
    portfolioSessionId();
    render();
    restoreDraft();
    updateComposer();
    if (state.selected && msgsOf(state.selected).length) scrollToBottom();
    focusComposer();
    saveNow();
  }
  // This script sits at the end of <body>, so the DOM is ready: start now instead of waiting for
  // the deferred CDN scripts. When they arrive (DOMContentLoaded), re-render the open thread's markdown.
  init();
  document.addEventListener('DOMContentLoaded', () => { if (view === 'chat' && state.selected) fillMarkdown(el.view, state.selected); });
})();
</script>
</body>
</html>
